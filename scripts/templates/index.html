<!DOCTYPE html>
<html>
<head>
    <title>Tracking</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
</head>
<body>
    <h1 style="font-size:50px;">Skeleton tracking with Realsense cameras</h1>
    <div style="display:flex; height:1500px">

        <div style="width:50%; height:100%">
            <h2 style="font-size:30px;">3D plot</h2>
            <div id="plot" style="width:100%; height:100%;"></div>
        </div>

        <div style="width:50%; height:100%">
            <h2 style="font-size:30px;">Streaming</h2>
            <img id="image" src="" style="max-width:100%;">
        </div>
    </div>

    <script>
        const socket = io();   // single connection for everything

        // ── 3-D scatter ──────────────────────────────────────────────
        let plotInitialized = false;

        const layout = {
            title: '3D Scatter Plot',
            scene: {
                xaxis: { title: 'X', range: [-2, 2] },
                yaxis: { title: 'Y', range: [-2, 2] },
                zaxis: { title: 'Z', range: [-2, 2] }
            },
            margin: { l: 0, r: 0, b: 0, t: 50 }
        };

        socket.on('update_scatter', function(point) {
            const trace = {
                x: point.x,
                y: point.y,
                z: point.z,
                mode: 'markers',
                marker: { size: 12, color: 'rgb(255,0,0)', opacity: 0.8 },
                type: 'scatter3d'
            };

            if (!plotInitialized) {
                Plotly.newPlot('plot', [trace], layout);
                plotInitialized = true;
            } else {
                // react() diffs and redraws only what changed
                Plotly.react('plot', [trace], layout);
            }
        });

        // ── Image stream ─────────────────────────────────────────────
        socket.on('update_stream', function(data) {
            document.getElementById('image').src =data.frame;
                //'data:image/jpeg;base64,' + data.frame;  // jpeg is faster than png
        });
    </script>
</body>
</html>
