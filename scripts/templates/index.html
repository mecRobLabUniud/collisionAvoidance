<!DOCTYPE html>
<html>
<head>
    <title>Tracking</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
</head>
<body>
    <h1 style="font-size:50px;">Skeleton tracking with Realsense cameras</h1>
    
    <div style="display:flex; height:1000px">
        <div style="width:70%; height:100%">
            <h2 style="font-size:30px;">3D plot</h2>
            <div id="plot" style="width:100%; height:100%;"></div>
        </div>

        <div style="width:30%; height:100%">
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image1" src="" style="max-width:100%;">
            </div>
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image2" src="" style="max-width:100%;">
            </div>
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image3" src="" style="max-width:100%;">
            </div>
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image4" src="" style="max-width:100%;">
            </div>
        </div>
    </div>

    <script>
        const socket = io();   // single connection for everything

        // ── 3-D scatter ──────────────────────────────────────────────
        let plotInitialized = false;

        const layout = {
            title: '3D Skeleton Reconstruction',
            scene: {
                xaxis: { title: 'X', range: [-2, 2] },
                yaxis: { title: 'Y', range: [-2, 2] },
                zaxis: { title: 'Z', range: [-2, 2] }
            },
            margin: { l: 0, r: 0, b: 0, t: 50 }
        };

        let x_data = []
        let y_data = []
        let z_data = []

        socket.on('update_scatter', function(point) {
            x_data.push(point.x[0], point.x[1], null);
            y_data.push(point.y[0], point.y[1], null);
            z_data.push(point.z[0], point.z[1], null);         
        });

        socket.on('display_scatter', function() {
            const trace = {
                x: x_data.slice(),
                y: y_data.slice(),
                z: z_data.slice(),
                mode: 'markers+lines',
                marker: {
                    color: 'rgb(127, 127, 127)',
                    size: 10,
                    symbol: 'circle',
                    line: {
                        color: 'rgb(204, 204, 204)',
                        width: 5},
                    opacity: 0.8},
                type: 'scatter3d'};

            if (!plotInitialized) {
                Plotly.newPlot('plot', [trace], layout);
                plotInitialized = true;
            } else {
                // react() diffs and redraws only what changed
                Plotly.react('plot', [trace], layout);
            }

            x_data = []
            y_data = []
            z_data = []
        });

        // ── Image stream ─────────────────────────────────────────────
        socket.on('update_stream1', function(data) {
            document.getElementById('image1').src = data.frame;
        });

        socket.on('update_stream2', function(data) {
            document.getElementById('image2').src = data.frame;
        });

        socket.on('update_stream3', function(data) {
            document.getElementById('image3').src = data.frame;
        });

        socket.on('update_stream4', function(data) {
            document.getElementById('image4').src = data.frame;
        });
    </script>
</body>
</html>
