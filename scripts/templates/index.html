<!DOCTYPE html>
<html>
<head>
    <title>Tracking</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
</head>
<body>
    <h1 style="font-size:50px;">Skeleton tracking with Realsense cameras</h1>
    
    <div style="display:flex; height:1000px">
        <div style="width:70%; height:100%">
            <h2 style="font-size:30px;">3D plot</h2>
            <div id="plot" style="width:100%; height:100%;"></div>
        </div>

        <div style="width:30%; height:100%">
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image1" src="" style="max-width:100%;">
            </div>
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image2" src="" style="max-width:100%;">
            </div>
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image3" src="" style="max-width:100%;">
            </div>
            <div>
                <h2 style="font-size:30px;">Streaming</h2>
                <img id="image4" src="" style="max-width:100%;">
            </div>
        </div>
    </div>

    <script>



        // Camera settings: eye = camera position, center = look-at point, up = up-vector
        const camera = {
        eye: { x: 0.5, y: 1.5, z: 0.5 },
        center: { x: 0, y: 0, z: 0.1 },
        up: { x: 0, y: 0, z: 1 },
        projection: { type: 'perspective' } // 'perspective' or 'orthographic'
        };

        // Scene layout: aspectmode and axis ticks/labels; aspectmode='cube' or 'data'
        const scene = {
        camera: camera,
        aspectmode: 'cube', // 'cube' makes axes equal (x=y=z). Use 'data' to match data ranges.
        xaxis: { title: 'X', backgroundcolor: '#fff', gridcolor: '#ddd', zerolinecolor: '#444' , range: [-1, 1], nticks: 5},
        yaxis: { title: 'Y', backgroundcolor: '#fff', gridcolor: '#ddd', zerolinecolor: '#444' , range: [-1, 1], nticks: 5},
        zaxis: { title: 'Z', backgroundcolor: '#fff', gridcolor: '#ddd', zerolinecolor: '#444' , range: [-1, 1], nticks: 5}
        };

        // Layout: force a square plot by setting equal width and height and small margins
        const size = 1200; // pixel size for both width and height (square)
        const layout = {
        width: size,
        height: size,
        margin: { l: 20, r: 20, t: 20, b: 20 }, // tight margins
        scene: scene,
        scene_dragmode: 'orbit', // needed if you set camera.up to something other than z (orbit respects up vector)
        paper_bgcolor: '#ffffff',
        plot_bgcolor: '#ffffff'
        };

        // Example: programmatically update the camera after 1.5s (demonstrates how to change view)
        // setTimeout(() => {
        // const newCamera = {
        // eye: { x: -1.8, y: 0.8, z: 1.0 },
        // center: { x: 0.2, y: 0, z: 0 },
        // up: { x: 0, y: 0, z: 1 },
        // projection: { type: 'perspective' }
        // };
        // Plotly.relayout('plot3d', { 'scene.camera': newCamera });
        // }, 1500);


        setTimeout(update_scatter, 0);
        setTimeout(display_scatter, 0);



        const socket = io();   // single connection for everything

        // ── 3-D scatter ──────────────────────────────────────────────
        let plotInitialized = false;

        let x_data = []
        let y_data = []
        let z_data = []

        function update_scatter() {
            socket.on('update_scatter', function(point) {
                x_data.push(point.x[0], point.x[1], null);
                y_data.push(point.y[0], point.y[1], null);
                z_data.push(point.z[0], point.z[1], null);         
            });
        }

        function display_scatter() {
            socket.on('display_scatter', function() {
                const trace = {
                    x: x_data,
                    y: y_data,
                    z: z_data,
                    mode: 'markers+lines',
                    marker: {
                        color: 'rgb(127, 127, 127)',
                        size: 10,
                        symbol: 'circle',
                        line: {
                            color: 'rgb(204, 204, 204)',
                            width: 5},
                        opacity: 0.8},
                    type: 'scatter3d'};

                if (!plotInitialized) {
                    Plotly.newPlot('plot', [trace], layout);
                    plotInitialized = true;
                } else {
                    // react() diffs and redraws only what changed
                    Plotly.react('plot', [trace], layout);
                }

                x_data = []
                y_data = []
                z_data = []
            });
        }

        // ── Image stream ─────────────────────────────────────────────
        socket.on('update_stream1', function(data) {
            document.getElementById('image1').src = data.frame;
        });

        socket.on('update_stream2', function(data) {
            document.getElementById('image2').src = data.frame;
        });

        socket.on('update_stream3', function(data) {
            document.getElementById('image3').src = data.frame;
        });

        socket.on('update_stream4', function(data) {
            document.getElementById('image4').src = data.frame;
        });
    </script>
</body>
</html>
